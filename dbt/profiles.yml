sports_analytics:
  target: dev
  outputs:
    dev:
      type: databricks
      catalog: workspace
      schema: dev_silver
      # Airflow's DATABRICKS_HOST includes the scheme; the adapter wants a bare hostname.
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 4
    prod:
      type: databricks
      catalog: workspace
      schema: silver
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 4
