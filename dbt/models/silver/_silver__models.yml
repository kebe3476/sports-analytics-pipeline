version: 2

models:

  - name: stg_nfl_games
    description: '{{ doc("stg_games_model") }}'
    columns:
      - name: sport
        description: '{{ doc("col_sport") }}'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['nfl']
      - name: game_id
        description: '{{ doc("col_game_id") }}'
        data_tests:
          - not_null
          - unique
      - name: source_game_id
        description: '{{ doc("col_source_game_id") }}'
        data_tests:
          - not_null
          - unique
      - name: season
        description: '{{ doc("col_season") }}'
        data_tests:
          - not_null
      - name: game_date
        description: '{{ doc("col_game_date") }}'
        data_tests:
          - not_null
      - name: game_type
        description: '{{ doc("col_game_type") }}'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['regular', 'postseason']
      - name: home_team_id
        description: '{{ doc("col_team_id") }}'
        data_tests:
          - not_null
      - name: home_team_abbrev
        description: '{{ doc("col_team_abbrev") }}'
      - name: home_team_name
        description: '{{ doc("col_team_name") }}'
      - name: home_team_conference
        description: '{{ doc("col_team_conference") }}'
      - name: away_team_id
        description: '{{ doc("col_team_id") }}'
        data_tests:
          - not_null
      - name: away_team_abbrev
        description: '{{ doc("col_team_abbrev") }}'
      - name: away_team_name
        description: '{{ doc("col_team_name") }}'
      - name: away_team_conference
        description: '{{ doc("col_team_conference") }}'
      - name: home_score
        description: '{{ doc("col_score") }}'
        data_tests:
          - not_null
      - name: away_score
        description: '{{ doc("col_score") }}'
        data_tests:
          - not_null
      - name: overtime_flag
        description: '{{ doc("col_overtime_flag") }}'
      - name: neutral_site
        description: '{{ doc("col_neutral_site") }}'
      - name: attendance
        description: '{{ doc("col_attendance") }}'

