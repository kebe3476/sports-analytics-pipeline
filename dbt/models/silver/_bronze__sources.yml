version: 2

sources:
  - name: bronze
    description: Raw ingestion tables loaded by the Airflow bronze DAGs. One schedule table and one recap table per sport.
    database: workspace
    schema: bronze
    tables:
      - name: nfl_games_raw
        description: NFL schedules and results from nflverse, one row per game.
      - name: nfl_recaps_raw
        description: ESPN game summary JSON for NFL games, one row per game with a recap.
      - name: ncaaf_games_raw
        description: NCAAF games from the CollegeFootballData API, one row per game.
      - name: ncaaf_recaps_raw
        description: ESPN game summary JSON for NCAAF games.
      - name: nhl_games_raw
        description: NHL schedule from api-web.nhle.com, flattened, one row per game.
      - name: nhl_recaps_raw
        description: ESPN game summary JSON for NHL games.
      - name: nba_games_raw
        description: nba_api LeagueGameLog output. Two rows per game, one per team.
      - name: nba_recaps_raw
        description: ESPN game summary JSON for NBA games.
      - name: mlb_games_raw
        description: MLB Stats API schedule, one row per game. Does not include scores.
      - name: mlb_recaps_raw
        description: ESPN game summary JSON for MLB games. Not yet populated.
