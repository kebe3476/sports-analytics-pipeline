version: 2

sources:
  - name: bronze
    description: Raw ingestion tables loaded by the Airflow bronze DAGs. One schedule table and one recap table per sport.
    database: workspace
    schema: bronze
    tables:
      - name: nfl_games_raw
        description: NFL schedules and results from nflverse, one row per game.
      - name: nfl_recaps_raw
        description: ESPN game summary JSON for NFL games, one row per game with a recap.
      - name: ncaaf_games_raw
        description: NCAAF games from the CollegeFootballData API, one row per game.
      - name: ncaaf_recaps_raw
        description: ESPN game summary JSON for NCAAF games.
